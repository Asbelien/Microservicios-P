version: "3.9"

services:

  mysql-categoria:
    image: mysql:8.0
    container_name: mysql-categoria
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_categoria_dev
    ports:
      - "3307:3306"

  mysql-producto:
    image: mysql:8.0
    container_name: mysql-producto
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_producto_dev
    ports:
      - "3308:3306"

  mysql-cliente:
    image: mysql:8.0
    container_name: mysql-cliente
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clientes_db
    ports:
      - "3309:3306"

  mysql-pedido:
    image: mysql:8.0
    container_name: mysql-pedido
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pedidos_db
    ports:
      - "3310:3306"

  config-server:
    build:
      context: ./config-server
    container_name: config-server
    restart: always
    ports:
      - "8888:8888"

  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    restart: always
    depends_on:
      - config-server
    ports:
      - "8761:8761"

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    restart: always
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"

  categoria-service:
    build:
      context: ./categoria-service
    container_name: categoria-service
    restart: always
    depends_on:
      - mysql-categoria
      - config-server
      - eureka-server
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-categoria:3306/bd_categoria_dev"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"
    ports:
      - "8082:8082"

  producto-service:
    build:
      context: ./producto-service
    container_name: producto-service
    restart: always
    depends_on:
      - mysql-producto
      - config-server
      - eureka-server
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-producto:3306/bd_producto_dev"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"
    ports:
      - "8083:8083"

  cliente-service:
    build:
      context: ./cliente-service
    container_name: cliente-service
    restart: always
    depends_on:
      - mysql-cliente
      - config-server
      - eureka-server
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-cliente:3306/clientes_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"
    ports:
      - "8084:8084"

  pedido-service:
    build:
      context: ./pedido-service
    container_name: pedido-service
    restart: always
    depends_on:
      - mysql-pedido
      - config-server
      - eureka-server
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-pedido:3306/pedidos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"
    ports:
      - "8085:8085"